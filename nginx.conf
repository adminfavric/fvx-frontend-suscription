server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss;

    location /api/auth/ {
        proxy_pass http://fvx_suscription_backend_web:8080/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://fvx_suscription_backend_web:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://fvx_suscription_backend_web:8080/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # El detector de versión del admin consulta este archivo: nunca cachearlo,
    # o el navegador seguiría viendo la versión vieja tras un deploy.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # El index referencia los bundles con hash; si se cachea, el navegador puede
    # quedar apuntando a bundles que ya no existen tras un deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
